<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>ვებ-გვერდი</title>
    <style>
        /* მთავარი კონტეინერი */
        .card-container {
            position: relative;
            display: flex;
            width: 800px;
            height: 450px;
            margin: 50px auto;
        }

        /* მარცხენა თეთრი ბოქსი */
        .left-box {
            width: 55%;
            background-color: #ffffff;
        }

        /* მარჯვენა ღია მწვანე ბოქსი */
        .right-box {
            width: 45%;
            background-color: #d2e0db;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .sticker {
            z-index: 3;
            display: flex;
            width: 260px;
            min-height: 120px;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            border: 6px solid #ffffff;
            background-color: #d2e0db;
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.2);
            color: #333333;
            font-family: sans-serif;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.3;
            text-align: center;
        }

        /* სურათი - გადაწეული ოდნავ მარცხნივ (left: 20px) */
        .overlay-img {
            position: absolute;
            top: 40px;
            left: 20px;       /* აქ შეამცირე რიცხვი უფრო მარცხნივ გადასაწევად */
            width: 420px;
            height: 370px;
            object-fit: cover;
            z-index: 2;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <!-- სურათი -->
        <img class="overlay-img" src="111.jpg" alt="Model">
        <!-- ფონის ბლოკები -->
        <div class="left-box"></div>
        <div class="right-box"></div>
        <div class="sticker">WE CHANGE THE WORLD ONE EYEBROW AT A TIME</div>
    </div>

</body>
</html>
